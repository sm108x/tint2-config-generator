<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tint2 Config Generator</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #262636;
    --panel-alt: #2e2e42;
    --border: #3a3a52;
    --text: #e4e4ef;
    --text-dim: #9a9ab0;
    --accent: #7aa2f7;
    --accent-dim: #3d5a99;
    --mono: "SFMono-Regular", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { font-size: 12px; color: var(--text-dim); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 340px 1fr 380px;
    min-height: 0;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; overflow-y: auto; }
  }
  #controls {
    overflow-y: auto;
    border-right: 1px solid var(--border);
    padding: 12px;
  }
  #preview-col {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #preview-stage {
    flex: 1;
    position: relative;
    background:
      linear-gradient(45deg, #15151f 25%, transparent 25%),
      linear-gradient(-45deg, #15151f 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #15151f 75%),
      linear-gradient(-45deg, transparent 75%, #15151f 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    background-color: #0d0d14;
    overflow: hidden;
    margin: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  #desktop {
    position: absolute;
    inset: 0;
  }
  #output-col {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    min-width: 0;
  }
  #output-toolbar {
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #output {
    flex: 1;
    margin: 0;
    padding: 12px;
    overflow: auto;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.5;
    white-space: pre;
    color: #c9d6f0;
  }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    padding: 10px 12px 12px;
  }
  legend {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    padding: 0 6px;
  }
  label {
    display: block;
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 8px;
    margin-bottom: 3px;
  }
  label:first-of-type { margin-top: 0; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; min-width: 0; }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 5px 7px;
    font-size: 12px;
    font-family: inherit;
  }
  textarea { font-family: var(--mono); font-size: 11px; resize: vertical; min-height: 50px; }
  input[type="color"] {
    width: 36px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: none;
  }
  input[type="range"] { width: 100%; }
  .colorrow { display: flex; align-items: center; gap: 8px; }
  .colorrow input[type="number"] { width: 60px; flex: none; }
  .check { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--text); }
  .check input { margin: 0; }
  button {
    background: var(--panel-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent-dim); border-color: var(--accent); }
  .itemlist { display: flex; flex-direction: column; gap: 4px; }
  .itemrow {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 6px;
    font-size: 12px;
  }
  .itemrow.disabled { opacity: 0.45; }
  .itemrow span.name { flex: 1; }
  .itemrow button { padding: 2px 6px; font-size: 11px; }
  small.hint { display: block; color: var(--text-dim); font-size: 10.5px; margin-top: 4px; }

  /* --- live panel preview --- */
  .tpanel {
    position: absolute;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .tpanel .titem {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    color: #fff;
  }
  .tpanel .titem.taskbar {
    flex: 1 1 auto;
    min-width: 30px;
    justify-content: flex-start;
  }
  .tpanel .titem .task {
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 11px;
    background: rgba(255,255,255,0.06);
  }
  .tpanel .titem .task.active {
    background: rgba(255,255,255,0.18);
  }
  .tpanel .titem .icon {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background: rgba(255,255,255,0.35);
    flex: none;
  }
</style>
</head>
<body>

<header>
  <h1>tint2 Config Generator</h1>
  <span>build a tint2rc visually, preview it, export it</span>
</header>

<main>
  <div id="controls"></div>

  <div id="preview-col">
    <div id="preview-stage">
      <div id="desktop"></div>
    </div>
  </div>

  <div id="output-col">
    <div id="output-toolbar">
      <button id="btn-copy">Copy</button>
      <button id="btn-download" class="primary">Download tint2rc</button>
    </div>
    <pre id="output"></pre>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
